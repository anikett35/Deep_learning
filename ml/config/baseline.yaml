# Baseline Clean Model Configuration (Control Group)
experiment_name: "ModelGuard-Baseline"
architecture: "BaselineCNN"

fast_mode:
  epochs: 3
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  sample_size: 1500

full_mode:
  epochs: 20
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  sample_size: null # Full CIFAR-10

optimizer: "Adam"
scheduler: "CosineAnnealingLR"
early_stopping_patience: 5
save_checkpoint_freq: 1
target_metric: "val_accuracy"
